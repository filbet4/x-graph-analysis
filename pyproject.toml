[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "x-graph-analysis"
version = "0.1.0"
description = "A modular foundation for graph-based analysis of relationships between posts on X."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Thesis project" }]
dependencies = [
    "neo4j>=6.4,<7",
    "networkx>=3.3",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-networkx>=3.3",
]

[project.scripts]
x-graph-analysis = "x_graph_analysis.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/x_graph_analysis"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "ARG", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["x_graph_analysis"]
